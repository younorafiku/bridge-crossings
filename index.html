<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230C1B22'/%3E%3Cpath d='M5 23Q16 5 27 23' stroke='%23F4E8DA' stroke-width='3.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Bridge Crossings · Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500;1,600&display=swap">
<style>
:root {
  --ink: #0C1B22; --ink2: #34454D; --mute: #5B6B72;
  --line: #E4E8EA; --line2: #D0D7DA; --track: #ECEFF0; --wash: #F6F7F8;
  --cream: #F4E8DA; --cream2: #FAF5ED;
  --late: #B4442A; --soon: #8A5A00;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
html { background: #fff; color: var(--ink); color-scheme: light; -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 28px; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 0; background: var(--ink); color: #fff; padding: 8px 12px; z-index: 90; }
.skip:focus { left: 8px; top: 8px; }

/* Header */
.head { padding: 64px 0 30px; }
.eyebrow { margin: 0 0 12px; font-size: 16px; color: var(--mute); }
h1 { margin: 0 0 20px; font: 500 clamp(44px, 9vw, 78px)/1 var(--serif); letter-spacing: -.025em; }
h1 em { font-style: italic; font-weight: 500; }
.about { max-width: 58ch; margin: 0 0 22px; font-size: 18px; line-height: 1.55; color: var(--ink2); white-space: pre-line; }
.stats { margin: 0; color: var(--mute); font-size: 15px; }
.stats b { color: var(--ink); font-weight: 600; }

/* Search and category buttons */
.tools { margin-top: 8px; display: grid; gap: 14px; }
.search { position: relative; display: block; }
.search svg { position: absolute; left: 18px; top: 50%; width: 18px; height: 18px; margin-top: -9px; color: var(--mute); pointer-events: none; }
.search input { width: 100%; min-height: 54px; padding: 0 18px 0 48px; border-radius: 14px; border: 1px solid var(--line2); background: #fff; color: var(--ink); font: inherit; font-size: 17px; -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--mute); opacity: 1; }
.search input:focus-visible { outline: none; border-color: var(--ink); box-shadow: 0 0 0 4px rgba(12, 27, 34, .09); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { min-height: 42px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--line2); background: #fff; cursor: pointer; font-size: 15px; transition: background .15s, border-color .15s; }
.chip-btn:hover { background: var(--wash); border-color: #B5C0C4; }
.chip-btn small { margin-left: 7px; font-size: 13px; color: var(--mute); }
.chip-btn[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
.chip-btn[aria-pressed=true] small { color: #C9D3D7; }

/* Categories and rows */
.msg { margin: 18px 0 0; color: var(--late); }
.note { margin: 40px 0 0; color: var(--mute); text-align: center; }
.demo { margin: 4px 0 20px; padding: 12px 16px; border: 1px solid #EBDDC9; background: var(--cream2); border-radius: 12px; color: var(--ink2); font-size: 15px; }
.cat { margin-top: 56px; }
#sections > .cat:first-child { margin-top: 36px; }
.cat-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 16px; }
.cat h2 { margin: 0; font: 500 34px/1.1 var(--serif); letter-spacing: -.012em; }
.cat-meta { margin: 0; color: var(--mute); font-size: 15px; }
.flow { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.flow li { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink2); }
.flow li + li::before { content: ""; width: 18px; height: 1px; background: var(--line2); }
.flow .n { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line2); display: grid; place-items: center; font-size: 12px; color: var(--mute); }
.flow .end { color: var(--mute); }
.rows { list-style: none; margin: 0; padding: 0; }
.cat .rows { margin-top: 18px; border-top: 1px solid var(--line); }
.row {
  --c: #F1BF5B;
  display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) minmax(170px, 230px);
  gap: 14px 36px; align-items: center;
  padding: 24px 4px; border-bottom: 1px solid var(--line);
}
.row.empty { display: block; color: var(--mute); text-align: center; padding: 40px 12px; }
.who { display: flex; align-items: center; gap: 14px; min-width: 0; }
.rank { flex: none; width: 36px; text-align: center; font: 500 32px/1 var(--serif); color: var(--mute); font-variant-numeric: lining-nums; }
.rank.top { color: var(--ink); }
.chip { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(12, 27, 34, .14); }
.name { font-weight: 600; font-size: 18px; overflow-wrap: anywhere; }
.prog-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; font-size: 15px; color: var(--mute); font-variant-numeric: tabular-nums; }
.count b { margin-right: 8px; font: 500 38px/1 var(--serif); color: var(--ink); font-variant-numeric: lining-nums; }
.bar { position: relative; height: 12px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--c); border-radius: 99px; box-shadow: inset 0 0 0 1px rgba(12, 27, 34, .10); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.bar u { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; }
.next { min-width: 0; }
.lbl { display: block; margin-bottom: 1px; font-size: 14px; color: var(--mute); }
.next b { display: block; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.due { display: block; margin-top: 3px; font-size: 14px; color: var(--mute); }
.due.late { color: var(--late); font-weight: 600; }
.due.today, .due.soon { color: var(--soon); font-weight: 600; }

/* Admin tray under a row */
.acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 2px; padding: 10px; background: var(--wash); border-radius: 14px; }
.acts .edit { margin-left: auto; }
.dlgroup { display: inline-flex; align-items: center; gap: 2px; }
.dl { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line2); border-radius: 12px; background: #fff; font-size: 15px; cursor: pointer; transition: border-color .15s; }
.dl:hover { border-color: var(--ink); }
.dl:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.dl svg { flex: none; width: 16px; height: 16px; color: var(--ink2); }
.dl.empty .face { color: var(--mute); }
.dl input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; opacity: 0; cursor: pointer; font-size: 16px; }
.xbtn { width: 40px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--mute); cursor: pointer; font-size: 14px; }
.xbtn:hover { background: #fff; color: var(--ink); }

/* Buttons */
.btn { min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line2); background: #fff; color: var(--ink); cursor: pointer; transition: background .15s, border-color .15s; }
.btn:hover:not(:disabled) { background: var(--wash); border-color: #B5C0C4; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #1B3641; border-color: #1B3641; }
.btn.danger { color: var(--late); border-color: #E6C5BB; }
.btn.danger:hover:not(:disabled) { background: #FBF1EE; border-color: var(--late); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.hold { border-color: var(--ink); }
.btn.hold::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 9px; border-radius: 50%; background: #E5A100; }
.linkbtn { background: none; border: 0; padding: 8px 0; color: var(--mute); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 14px; }

/* Admin bar */
.adminbar { position: sticky; top: 0; z-index: 30; background: rgba(255, 255, 255, .94); -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.adminbar .in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-top: 10px; padding-bottom: 10px; }
.adminbar strong { font: 600 20px/1 var(--serif); }
.adminbar .status { flex: 1 1 140px; font-size: 14px; color: var(--mute); }

/* Footer */
.foot { margin-top: 64px; margin-bottom: 56px; color: var(--mute); font-size: 14px; }
.foot-in { padding-top: 22px; border-top: 1px solid var(--line); }
.foot p { margin: 0 0 6px; max-width: 70ch; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 80;
  max-width: min(92vw, 460px); padding: 13px 18px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 15px;
  transition: opacity .2s, transform .2s; box-shadow: 0 12px 40px rgba(12, 27, 34, .28); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: #7F2E1A; }

/* Dialogs */
.overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(12, 27, 34, .44); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.panel { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 28px; border-radius: 20px; background: #fff; border: 1px solid var(--line); box-shadow: 0 28px 90px rgba(12, 27, 34, .26); }
.panel h2 { margin: 0 0 16px; font: 500 32px/1.1 var(--serif); letter-spacing: -.012em; }
.panel p, .panel ol { margin: 0 0 16px; color: var(--ink2); font-size: 16px; }
.panel ol { padding-left: 22px; }
.panel li { margin-bottom: 6px; }
.panel a { color: var(--ink); text-underline-offset: 3px; }
.field { display: block; margin-bottom: 16px; }
.field > span { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: var(--ink2); }
.field small { display: block; margin-top: 5px; color: var(--mute); font-size: 13px; }
.panel input[type=text], .panel input[type=password], .panel input[type=number], .panel input[type=date], .panel select, .panel textarea {
  width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line2); background: #fff; color: var(--ink); font: inherit; font-size: 16px; }
.panel input:focus-visible, .panel select:focus-visible, .panel textarea:focus-visible { outline: none; border-color: var(--ink); box-shadow: 0 0 0 4px rgba(12, 27, 34, .09); }
.panel textarea { resize: vertical; }
.panel input[type=color] { width: 46px; height: 46px; padding: 3px; border-radius: 12px; border: 1px solid var(--line2); background: #fff; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 36px; height: 36px; border-radius: 50%; background: var(--c); border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(12, 27, 34, .16); cursor: pointer; }
.sw[aria-pressed=true] { box-shadow: 0 0 0 2px var(--ink); }
.steprow { display: grid; grid-template-columns: 22px 1fr 40px 40px 40px; gap: 6px; align-items: center; margin-bottom: 6px; }
.steprow .sn { color: var(--mute); font-size: 14px; text-align: center; }
.ib { width: 40px; height: 46px; border-radius: 10px; border: 1px solid var(--line2); background: #fff; cursor: pointer; }
.ib:hover:not(:disabled) { background: var(--wash); }
.ib:disabled { opacity: .3; cursor: not-allowed; }
.catrow { display: grid; grid-template-columns: minmax(0, 1fr) 40px 40px auto; gap: 6px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.catrow .cn b { display: block; font-size: 17px; overflow-wrap: anywhere; }
.catrow .cn small { display: block; color: var(--mute); font-size: 13px; overflow-wrap: anywhere; }
.catlist { margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.hint { color: var(--mute) !important; font-size: 14px !important; }
.formerr { min-height: 1.3em; margin: 0 0 8px !important; color: var(--late) !important; font-size: 14px !important; }
.buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.buttons .spacer { flex: 1; }

@media (max-width: 680px) {
  .adminbar { position: static; }
  .wrap { padding: 0 18px; }
  .head { padding: 36px 0 22px; }
  .about { font-size: 17px; }
  .cat { margin-top: 44px; }
  .row { grid-template-columns: 1fr; gap: 12px; padding: 20px 2px; }
  .next { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "lbl due" "act due"; column-gap: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .next .lbl { grid-area: lbl; }
  .next b { grid-area: act; }
  .next .due { grid-area: due; align-self: end; margin: 0; text-align: right; }
  .pair { grid-template-columns: 1fr; }
  .flow li + li::before { display: none; }
  .panel { padding: 22px; }
  .acts .edit { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .bar i, .toast, .chip-btn, .btn, .dl { transition: none; }
}
</style>
</head>
<body>
<a class="skip" href="#sections">Skip to the ranking</a>
<div id="adminbar" class="adminbar" hidden></div>

<header class="head">
  <div class="wrap">
    <p class="eyebrow" id="subtitle"></p>
    <h1 id="title">Bridge <em>Crossings</em></h1>
    <p class="about" id="about"></p>
    <p class="stats" id="stats"></p>
  </div>
</header>

<main class="wrap">
  <p id="demo-note" class="demo" hidden>Demo data. Nothing here is saved.</p>
  <p id="msg" class="msg" role="status"></p>
  <div class="tools" id="tools" hidden>
    <label class="search">
      <span class="sr">Search by name</span>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg>
      <input id="q" type="search" placeholder="Search by name" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Show one category" hidden></div>
  </div>
  <div id="sections"><ol class="rows"><li class="row empty">Loading…</li></ol></div>
  <noscript><p class="msg">This page needs JavaScript to show the progress.</p></noscript>
</main>

<footer class="foot wrap">
  <div class="foot-in">
    <p id="howto"></p>
    <p id="updated"></p>
    <button class="linkbtn" id="admin-link" type="button">Admin</button>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="logic.js"></script>
<script>
(function () {
  'use strict';
  var T = window.Tracker;
  var REPO = { owner: 'younorafiku', name: 'bridge-crossings', branch: 'main', file: 'data.json' };
  var TOKEN_KEY = 'bridge-crossings-admin-token';
  var qs = new URLSearchParams(location.search);
  var DEMO = qs.get('demo') === '1';

  var state = {
    data: T.normalize({}), sha: '', token: '', admin: false, loaded: false, pending: 0, first: true,
    status: '', sig: '', query: '', cat: 'all', hold: null, moved: false
  };

  // ---------- small helpers ----------
  function $(id) { return document.getElementById(id); }

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'style') Object.keys(v).forEach(function (s) { el.style.setProperty(s, v[s]); });
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  }

  function calIcon() {
    var ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg'), path = document.createElementNS(ns, 'path');
    svg.setAttribute('viewBox', '0 0 16 16');
    svg.setAttribute('aria-hidden', 'true');
    path.setAttribute('d', 'M3.5 4.5h9v8.5h-9zM3.5 7.3h9M5.7 2.6v2M10.3 2.6v2');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'currentColor');
    path.setAttribute('stroke-width', '1.3');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(path);
    return svg;
  }

  function nowCtx() { return { now: new Date().toISOString(), today: T.isoDate(new Date()) }; }

  function fmtDate(iso) {
    var p = iso.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function fmtStamp(iso) {
    var dt = new Date(iso);
    if (!iso || isNaN(dt)) return '';
    return dt.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function b64encode(str) {
    var bytes = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64decode(b64) {
    var bin = atob(b64.replace(/\s/g, '')), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function readToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
  function saveToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) { /* kept in memory only */ } }
  function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) { /* nothing to clear */ } }

  var toastTimer;
  function toast(msg, isErr) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, isErr ? 7000 : 2600);
  }

  function setStatus(s) {
    state.status = s;
    var el = $('status');
    if (el) el.textContent = statusText();
  }
  function statusText() {
    if (state.status === 'saving') return 'Saving…';
    if (state.status === 'saved') return 'Saved. Everyone sees it within about a minute.';
    return '';
  }

  // ---------- GitHub storage (admin only) ----------
  var FILE_PATH = '/repos/' + REPO.owner + '/' + REPO.name + '/contents/' + REPO.file;

  function api(path, opts) {
    opts = opts || {};
    var headers = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    if (opts.body) headers['Content-Type'] = 'application/json';
    return fetch('https://api.github.com' + path, { method: opts.method || 'GET', headers: headers, body: opts.body, cache: 'no-store' })
      .then(function (res) {
        if (res.ok) return res.json();
        var err = new Error('GitHub ' + res.status);
        err.status = res.status;
        return res.json().catch(function () { return {}; }).then(function (j) { err.detail = j.message || ''; throw err; });
      });
  }

  function readRemote() {
    return api(FILE_PATH + '?ref=' + encodeURIComponent(REPO.branch) + '&t=' + Date.now()).then(function (j) {
      return { data: T.normalize(JSON.parse(b64decode(j.content))), sha: j.sha };
    });
  }

  function writeRemote(data, sha, message) {
    var body = JSON.stringify({
      message: message,
      content: b64encode(JSON.stringify(data, null, 2) + '\n'),
      sha: sha,
      branch: REPO.branch
    });
    return api(FILE_PATH, { method: 'PUT', body: body }).then(function (j) { return j.content.sha; });
  }

  // Replays one change on top of the latest saved file, retrying if someone saved in between.
  function commit(op, args, ctx, label) {
    var tries = 0;
    function attempt() {
      return readRemote().then(function (cur) {
        var next = T.run(cur.data, op, args, ctx);
        return writeRemote(next, cur.sha, 'Tracker: ' + label).then(function (sha) { return { data: next, sha: sha }; });
      }).catch(function (e) {
        if ((e.status === 409 || e.status === 422) && ++tries < 4) return attempt();
        throw e;
      });
    }
    return attempt();
  }

  var chain = Promise.resolve();
  function runOp(op, args, label) {
    var ctx = nowCtx();
    state.data = T.run(state.data, op, args, ctx);   // show it straight away
    if (DEMO) { render(); return; }
    state.pending++;
    setStatus('saving');
    render();
    chain = chain.then(function () { return commit(op, args, ctx, label); }).then(function (res) {
      state.pending--;
      state.sha = res.sha;
      if (state.pending === 0) { state.data = res.data; setStatus('saved'); render(); }
    }, function (e) {
      state.pending--;
      handleError(e);
      if (state.pending === 0) return refresh(true);
    });
  }

  function describe(e) {
    if (e && e.status === 401) return 'GitHub did not accept the token. Sign in again.';
    if (e && (e.status === 403 || e.status === 404)) return 'This token cannot edit the project. It needs “Contents: Read and write” on the ' + REPO.name + ' repository.';
    if (e && e.status === 429) return 'GitHub says to slow down. Try again in a minute.';
    if (e instanceof TypeError) return 'No connection. Check your internet and try again.';
    return 'Could not save. ' + (e && e.message ? e.message : '');
  }
  function handleError(e) {
    setStatus('');
    toast(describe(e), true);
    if (e && e.status === 401) signOut();
  }

  // ---------- loading ----------
  function loadPublic() {
    return fetch('data.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) { return { data: T.normalize(j), sha: '' }; });
  }

  function refresh(force) {
    var p = state.admin ? readRemote() : loadPublic();
    return p.then(function (r) {
      if (state.pending) return;
      var sig = r.data.rev + '|' + r.data.updatedAt;
      var changed = sig !== state.sig;
      state.data = r.data; state.sha = r.sha; state.sig = sig; state.loaded = true;
      $('msg').textContent = '';
      if (changed || force || state.first) render();
    }).catch(function (e) {
      if (state.admin && e && e.status === 401) { handleError(e); return; }
      if (!state.loaded) {
        $('msg').textContent = 'Could not load the progress. Check your connection and refresh the page.';
        $('sections').textContent = '';
      }
    });
  }

  // ---------- rendering ----------
  function dueText(info, deadline) {
    if (info.state === 'none') return 'No deadline yet';
    var ds = fmtDate(deadline);
    if (info.state === 'late') return 'Due ' + ds + ', ' + (-info.days) + (info.days === -1 ? ' day' : ' days') + ' late';
    if (info.state === 'today') return 'Due today, ' + ds;
    if (info.days === 1) return 'Due tomorrow, ' + ds;
    return 'Due ' + ds + ', in ' + info.days + ' days';
  }

  function renderTitle(title) {
    var el = $('title');
    el.textContent = '';
    var parts = title.trim().split(/\s+/);
    if (parts.length > 1) {
      var last = parts.pop();
      el.appendChild(document.createTextNode(parts.join(' ') + ' '));
      el.appendChild(h('em', { text: last }));
    } else {
      el.appendChild(h('em', { text: title }));
    }
  }

  function renderHead(d) {
    $('subtitle').textContent = d.subtitle;
    renderTitle(d.title);
    $('about').textContent = d.about;
    $('about').hidden = !d.about;
    document.title = d.title + ' · ' + d.subtitle;

    var sum = T.summary(d), stats = $('stats');
    stats.textContent = '';
    if (!sum.people) { stats.textContent = 'No participants yet.'; return; }
    stats.appendChild(h('b', { text: String(sum.people) }));
    stats.appendChild(document.createTextNode(sum.people === 1 ? ' participant' : ' participants'));
    if (d.categories.length === 1) {
      stats.appendChild(document.createTextNode(', '));
      stats.appendChild(h('b', { text: String(sum.cycles) }));
      stats.appendChild(document.createTextNode(' ' + T.cycleLabel(d.categories[0], sum.cycles) + ' finished in total'));
    } else {
      stats.appendChild(document.createTextNode(' in '));
      stats.appendChild(h('b', { text: String(d.categories.length) }));
      stats.appendChild(document.createTextNode(' categories'));
    }
  }

  function renderTools(d) {
    $('tools').hidden = !d.people.length;
    var chips = $('chips');
    chips.textContent = '';
    chips.hidden = d.categories.length < 2;
    if (chips.hidden) return;
    function chip(label, id, count) {
      return h('button', { type: 'button', class: 'chip-btn', 'aria-pressed': state.cat === id ? 'true' : 'false',
        onclick: function () { state.cat = id; render(); } }, label, h('small', { text: String(count) }));
    }
    chips.appendChild(chip('All', 'all', d.people.length));
    d.categories.forEach(function (c) {
      chips.appendChild(chip(c.name, c.id, d.people.filter(function (p) { return p.categoryId === c.id; }).length));
    });
  }

  function flowList(cat) {
    var ol = h('ol', { class: 'flow', 'aria-label': 'Steps for ' + cat.name });
    cat.steps.forEach(function (s, i) {
      ol.appendChild(h('li', null, h('span', { class: 'n', text: String(i + 1) }), h('span', { text: s })));
    });
    ol.appendChild(h('li', { class: 'end' }, '= 1 ' + cat.cycleName + ' finished'));
    return ol;
  }

  // Deadline control on a row: a button-like pill that shows the date. The real date input sits
  // invisibly on top, so a tap opens the phone's own date picker.
  function dlGroup(p) {
    var inp = h('input', { type: 'date', value: p.deadline, 'aria-label': 'Deadline for ' + p.name,
      onchange: function (e) { runOp('setDeadline', { id: p.id, deadline: e.target.value }, p.name + ': deadline ' + (e.target.value || 'cleared')); } });
    inp.addEventListener('click', function () {
      try { if (inp.showPicker && window.matchMedia('(pointer: fine)').matches) inp.showPicker(); } catch (e) { /* the browser opens it by itself */ }
    });
    return h('div', { class: 'dlgroup' },
      h('label', { class: 'dl' + (p.deadline ? '' : ' empty') }, calIcon(),
        h('span', { class: 'face', text: p.deadline ? fmtDate(p.deadline) : 'Set deadline' }), inp),
      p.deadline ? h('button', { class: 'xbtn', type: 'button', title: 'Clear deadline', 'aria-label': 'Clear deadline for ' + p.name,
        onclick: function () { runOp('setDeadline', { id: p.id, deadline: '' }, p.name + ': deadline cleared'); } }, '✕') : null);
  }

  function rowFor(d, cat, item, tdy, fills) {
    var p = item.person, v = T.personView(d, p), info = T.deadlineInfo(p.deadline, tdy);
    var fill = h('i', { 'data-w': (v.frac * 100) + '%' });
    fills.push(fill);
    var bar = h('div', {
      class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(v.pct),
      'aria-label': p.name + ': ' + v.done + ' of ' + v.n + ' steps done in the current ' + cat.cycleName
    }, fill);
    for (var i = 1; i < v.n; i++) bar.appendChild(h('u', { style: { left: (i / v.n * 100) + '%' } }));

    var row = h('li', { class: 'row', style: { '--c': p.color } },
      h('div', { class: 'who' },
        h('span', { class: 'rank' + (item.rank && item.rank <= 3 ? ' top' : ''), text: item.rank ? String(item.rank) : '–', title: item.rank ? 'Rank ' + item.rank : 'Not started yet' }),
        h('span', { class: 'chip', 'aria-hidden': 'true' }),
        h('span', { class: 'name', text: p.name })),
      h('div', { class: 'prog' },
        h('div', { class: 'prog-top' },
          h('span', { class: 'count' }, h('b', { text: String(p.cycles) }), ' ' + T.cycleLabel(cat, p.cycles) + ' finished'),
          h('span', { text: v.pct + '%' })),
        bar),
      h('div', { class: 'next' },
        h('span', { class: 'lbl', text: 'Next' }),
        h('b', { text: v.next }),
        h('span', { class: 'due ' + info.state, text: dueText(info, p.deadline) })));

    if (state.admin) {
      row.appendChild(h('div', { class: 'acts' },
        h('button', { class: 'btn primary', type: 'button',
          onclick: function () { runOp('stepDone', { id: p.id }, p.name + ': ' + v.next + ' done'); } },
          'Mark “' + v.next + '” done'),
        h('button', { class: 'btn', type: 'button', disabled: !(p.cycles || p.done),
          onclick: function () { runOp('undoStep', { id: p.id }, p.name + ': undo'); } }, 'Undo'),
        dlGroup(p),
        h('button', { class: 'btn edit', type: 'button', onclick: function () { openPerson(p); } }, 'Edit')));
    }
    return row;
  }

  // Admin view: rows stay where they are while the admin works, so they never move under a tap.
  // The rank column still shows the true rank. "Update order" sorts the rows by it again.
  function sectionsFor(d) {
    var secs = T.sections(d);
    state.moved = false;
    if (!state.admin) return secs;
    if (!state.hold) state.hold = {};
    secs.forEach(function (s) {
      var id = s.category.id, ids = state.hold[id];
      if (!ids) { state.hold[id] = s.items.map(function (it) { return it.person.id; }); return; }
      var pos = {};
      ids.forEach(function (pid, i) { pos[pid] = i; });
      var known = s.items.filter(function (it) { return pos[it.person.id] !== undefined; })
        .sort(function (a, b) { return pos[a.person.id] - pos[b.person.id]; });
      var fresh = s.items.filter(function (it) { return pos[it.person.id] === undefined; });
      fresh.forEach(function (it) { ids.push(it.person.id); });   // new people go to the end and stay there
      var held = known.concat(fresh);
      if (held.some(function (it, i) { return it !== s.items[i]; })) state.moved = true;
      s.items = held;
    });
    return secs;
  }

  function resortRows() {
    state.hold = null;
    render();
    toast('Rows sorted by rank.');
  }

  function renderSections(d) {
    var host = $('sections'), q = state.query.trim(), secs = sectionsFor(d);
    host.textContent = '';
    if (!d.people.length) {
      host.appendChild(h('ol', { class: 'rows' }, h('li', { class: 'row empty',
        text: state.admin ? 'No one here yet. Use “Add person” above.' : 'No participants yet. Check back soon.' })));
      return;
    }
    var fills = [], tdy = T.isoDate(new Date()), shown = 0;
    secs.forEach(function (s, idx) {
      var c = s.category;
      if (state.cat !== 'all' && state.cat !== c.id) return;
      var items = s.items.filter(function (it) { return T.matchName(it.person.name, q); });
      if (q && !items.length) return;
      shown++;
      var list = h('ol', { class: 'rows' });
      if (!items.length) list.appendChild(h('li', { class: 'row empty',
        text: state.admin ? 'No one in this category yet.' : 'No participants in this category yet.' }));
      items.forEach(function (it) { list.appendChild(rowFor(d, c, it, tdy, fills)); });
      var n = s.items.length;
      host.appendChild(h('section', { class: 'cat', 'aria-labelledby': 'cat-' + idx },
        h('div', { class: 'cat-head' },
          h('h2', { id: 'cat-' + idx, text: c.name }),
          h('p', { class: 'cat-meta', text: n + (n === 1 ? ' participant, ' : ' participants, ') + s.cycles + ' ' + T.cycleLabel(c, s.cycles) + ' finished' })),
        flowList(c), list));
    });
    if (!shown) host.appendChild(h('p', { class: 'note', text: q ? 'No one matches “' + q + '”.' : 'Nothing to show here.' }));
    var paint = function () { fills.forEach(function (f) { f.style.width = f.getAttribute('data-w'); }); };
    if (state.first) requestAnimationFrame(function () { requestAnimationFrame(paint); });
    else paint();
  }

  function renderFoot(d) {
    $('howto').textContent = d.categories.length === 1
      ? 'Ranked by finished ' + T.cycleLabel(d.categories[0], 2) + ', then by the current bar. If both are equal, whoever got there first is higher.'
      : 'Ranked within each category by finished cycles, then by the current bar. If both are equal, whoever got there first is higher.';
    $('updated').textContent = d.updatedAt && !DEMO ? 'Last update: ' + fmtStamp(d.updatedAt) : '';
    $('admin-link').hidden = state.admin || DEMO;
  }

  function renderAdminBar() {
    var bar = $('adminbar');
    bar.textContent = '';
    bar.hidden = !state.admin;
    if (!state.admin) return;
    bar.appendChild(h('div', { class: 'wrap in' },
      h('strong', { text: DEMO ? 'Demo admin' : 'Admin' }),
      h('span', { class: 'status', id: 'status', text: statusText() }),
      state.moved ? h('button', { class: 'btn hold', type: 'button', onclick: resortRows,
        title: 'Rows stay where they are while you work. Tap to sort them by rank.' }, 'Update order') : null,
      h('button', { class: 'btn primary', type: 'button', onclick: function () { openPerson(null); } }, 'Add person'),
      h('button', { class: 'btn', type: 'button', onclick: openCategories }, 'Categories'),
      h('button', { class: 'btn', type: 'button', onclick: openSettings }, 'Settings'),
      h('button', { class: 'btn', type: 'button', onclick: signOut }, 'Sign out')));
  }

  function render() {
    var d = state.data;
    if (state.cat !== 'all' && !d.categories.some(function (c) { return c.id === state.cat; })) state.cat = 'all';
    renderHead(d);
    renderTools(d);
    renderSections(d);
    renderAdminBar();
    renderFoot(d);
    state.first = false;
  }

  // ---------- dialogs ----------
  function modal(title, build) {
    var root = $('modal-root'), prev = document.activeElement;
    var overlay = h('div', { class: 'overlay' });
    var panel = h('form', { class: 'panel', role: 'dialog', 'aria-modal': 'true', 'aria-label': title, novalidate: true });
    var errEl = h('p', { class: 'formerr', role: 'alert' });
    function onKey(e) { if (e.key === 'Escape') m.close(); }
    var m = {
      errEl: errEl,
      close: function () {
        overlay.remove();
        document.removeEventListener('keydown', onKey);
        if (prev && prev.focus) prev.focus();
      }
    };
    panel.addEventListener('submit', function (e) { e.preventDefault(); });
    panel.appendChild(h('h2', { text: title }));
    build(panel, m);
    document.addEventListener('keydown', onKey);
    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) m.close(); });
    overlay.appendChild(panel);
    root.appendChild(overlay);
    var first = panel.querySelector('input:not([type=color]), textarea, select');
    if (first) first.focus();
    return m;
  }

  function field(label, input, hint) {
    return h('label', { class: 'field' }, h('span', { text: label }), input, hint ? h('small', { text: hint }) : null);
  }

  function buttons(m, submitLabel, extra, onCancel) {
    return h('div', { class: 'buttons' }, extra || null, extra ? h('span', { class: 'spacer' }) : null,
      h('button', { class: 'btn', type: 'button', onclick: onCancel || m.close }, 'Cancel'),
      h('button', { class: 'btn primary', type: 'submit' }, submitLabel));
  }

  // The list of steps with move and remove buttons. It edits the array it is given.
  function stepsField(steps, label, hint) {
    var list = h('div', { class: 'steps' });
    var addBtn = h('button', { class: 'btn', type: 'button', onclick: function () {
      steps.push(''); paint();
      var ins = list.querySelectorAll('input');
      ins[ins.length - 1].focus();
    } }, 'Add a step');
    function move(i, j) { var t = steps[i]; steps[i] = steps[j]; steps[j] = t; paint(); }
    function paint() {
      list.textContent = '';
      steps.forEach(function (s, i) {
        var inp = h('input', { type: 'text', maxlength: '40', value: s, 'aria-label': 'Step ' + (i + 1) });
        inp.addEventListener('input', function () { steps[i] = inp.value; });
        list.appendChild(h('div', { class: 'steprow' },
          h('span', { class: 'sn', text: String(i + 1) }), inp,
          h('button', { type: 'button', class: 'ib', 'aria-label': 'Move step ' + (i + 1) + ' up', disabled: i === 0, onclick: function () { move(i, i - 1); } }, '↑'),
          h('button', { type: 'button', class: 'ib', 'aria-label': 'Move step ' + (i + 1) + ' down', disabled: i === steps.length - 1, onclick: function () { move(i, i + 1); } }, '↓'),
          h('button', { type: 'button', class: 'ib', 'aria-label': 'Remove step ' + (i + 1), disabled: steps.length === 1, onclick: function () { steps.splice(i, 1); paint(); } }, '✕')));
      });
      addBtn.disabled = steps.length >= T.MAX_STEPS;
    }
    paint();
    return h('div', { class: 'field' }, h('span', { text: label }), list, addBtn, hint ? h('small', { text: hint }) : null);
  }

  function openPerson(p) {
    var d = state.data, adding = !p, cats = d.categories;
    var catId = adding
      ? (state.cat !== 'all' && cats.some(function (c) { return c.id === state.cat; }) ? state.cat : cats[0].id)
      : p.categoryId;
    var color = adding ? T.nextColor(d) : p.color;
    function curCat() { return cats.filter(function (c) { return c.id === catId; })[0] || cats[0]; }
    function autoDue() { var c = curCat(); return c.defaultDays > 0 ? T.addDays(T.isoDate(new Date()), c.defaultDays) : ''; }

    modal(adding ? 'Add person' : 'Edit ' + p.name, function (panel, m) {
      var name = h('input', { type: 'text', maxlength: '40', autocomplete: 'off', value: adding ? '' : p.name });
      panel.appendChild(field('Name', name));

      var sel = null;
      if (cats.length > 1) {
        sel = h('select');
        cats.forEach(function (c) { sel.appendChild(h('option', { value: c.id, text: c.name })); });
        sel.value = catId;
        panel.appendChild(field('Category', sel, adding ? null : 'Changing the category starts their bar from zero.'));
      }

      var custom = h('input', { type: 'color', value: color, 'aria-label': 'Custom colour' });
      var sw = h('div', { class: 'swatches', role: 'group', 'aria-label': 'Colour' });
      var swButtons = T.PALETTE.map(function (c) {
        return h('button', { type: 'button', class: 'sw', 'aria-label': 'Colour ' + c, style: { '--c': c },
          onclick: function () { color = c; custom.value = c; paint(); } });
      });
      swButtons.forEach(function (b) { sw.appendChild(b); });
      sw.appendChild(custom);
      function paint() { swButtons.forEach(function (b, i) { b.setAttribute('aria-pressed', T.PALETTE[i].toLowerCase() === color.toLowerCase() ? 'true' : 'false'); }); }
      custom.addEventListener('input', function () { color = custom.value; paint(); });
      paint();
      panel.appendChild(h('div', { class: 'field' }, h('span', { text: 'Colour' }), sw));

      var dueTouched = false;
      var due = h('input', { type: 'date', value: adding ? autoDue() : p.deadline });
      due.addEventListener('input', function () { dueTouched = true; });
      panel.appendChild(field(adding ? 'Deadline for the first step' : 'Deadline for the next step', due, 'Leave empty for no deadline.'));

      var cycles = null, done = null;
      function fillDone(idx) {
        done.textContent = '';
        var steps = curCat().steps;
        for (var i = 0; i < steps.length; i++) {
          done.appendChild(h('option', { value: String(i), text: i === 0 ? 'Nothing yet' : steps[i - 1] + ' done' }));
        }
        done.value = String(Math.min(idx, steps.length - 1));
      }
      if (!adding) {
        cycles = h('input', { type: 'number', min: '0', max: '999', value: String(p.cycles) });
        done = h('select');
        fillDone(p.done);
        panel.appendChild(h('div', { class: 'pair' },
          field('Finished ' + T.cycleLabel(curCat(), 2), cycles, 'Only to correct a mistake.'),
          field('Current bar', done)));
      }
      if (sel) sel.addEventListener('change', function () {
        catId = sel.value;
        if (adding) { if (!dueTouched) due.value = autoDue(); }
        else { cycles.value = '0'; fillDone(0); }
      });

      var removeBtn = null, armed = false;
      if (!adding) {
        removeBtn = h('button', { class: 'btn danger', type: 'button', onclick: function () {
          if (!armed) { armed = true; removeBtn.textContent = 'Tap again to remove'; return; }
          runOp('removePerson', { id: p.id }, 'Remove ' + p.name);
          m.close();
        } }, 'Remove person');
      }
      panel.appendChild(m.errEl);
      panel.appendChild(buttons(m, adding ? 'Add' : 'Save', removeBtn));

      panel.addEventListener('submit', function () {
        var nm = name.value.trim();
        if (!nm) { m.errEl.textContent = 'Enter a name.'; name.focus(); return; }
        if (adding) runOp('addPerson', { id: T.makeId(), name: nm, color: color, deadline: due.value, categoryId: catId }, 'Add ' + nm);
        else runOp('editPerson', { id: p.id, name: nm, color: color, deadline: due.value, categoryId: catId, cycles: cycles.value, done: done.value }, 'Edit ' + nm);
        m.close();
      });
    });
  }

  function openCategories() {
    modal('Categories', function (panel, m) {
      panel.appendChild(h('p', { text: 'A category is a group of people who follow the same steps, such as filming or editing. Each category has its own steps, bars and ranking.' }));
      var list = h('div', { class: 'catlist' });
      function paint() {
        var d = state.data;
        list.textContent = '';
        d.categories.forEach(function (c, i) {
          var n = d.people.filter(function (p) { return p.categoryId === c.id; }).length;
          list.appendChild(h('div', { class: 'catrow' },
            h('div', { class: 'cn' }, h('b', { text: c.name }), h('small', { text: n + (n === 1 ? ' person: ' : ' people: ') + c.steps.join(' → ') })),
            h('button', { type: 'button', class: 'ib', 'aria-label': 'Move ' + c.name + ' up', disabled: i === 0,
              onclick: function () { runOp('moveCategory', { id: c.id, dir: -1 }, 'Move ' + c.name); paint(); } }, '↑'),
            h('button', { type: 'button', class: 'ib', 'aria-label': 'Move ' + c.name + ' down', disabled: i === d.categories.length - 1,
              onclick: function () { runOp('moveCategory', { id: c.id, dir: 1 }, 'Move ' + c.name); paint(); } }, '↓'),
            h('button', { type: 'button', class: 'btn', onclick: function () { m.close(); openCategory(c); } }, 'Edit')));
        });
      }
      paint();
      panel.appendChild(list);
      panel.appendChild(h('div', { class: 'buttons' },
        h('button', { class: 'btn', type: 'button', onclick: m.close }, 'Close'),
        h('button', { class: 'btn primary', type: 'button', disabled: state.data.categories.length >= T.MAX_CATEGORIES,
          onclick: function () { m.close(); openCategory(null); } }, 'Add category')));
    });
  }

  function openCategory(cat) {
    var d = state.data, adding = !cat;
    var steps = adding ? [''] : cat.steps.slice();
    modal(adding ? 'Add category' : 'Edit ' + cat.name, function (panel, m) {
      var name = h('input', { type: 'text', maxlength: '30', value: adding ? '' : cat.name, placeholder: 'For example: Editing' });
      var cn = h('input', { type: 'text', maxlength: '24', value: adding ? 'reel' : cat.cycleName });
      var cp = h('input', { type: 'text', maxlength: '24', value: adding ? '' : cat.cyclePlural, placeholder: 'Adds an s if empty' });
      var days = h('input', { type: 'number', min: '0', max: '60', value: adding ? '0' : String(cat.defaultDays) });
      panel.appendChild(field('Category name', name));
      panel.appendChild(stepsField(steps, 'Steps to finish one cycle, in order',
        'People keep their progress. If a bar is already past the new last step, it counts as a finished cycle.'));
      panel.appendChild(h('div', { class: 'pair' },
        field('What a finished cycle is called', cn, 'Singular, for example “reel” or “edit”.'),
        field('Plural (optional)', cp)));
      panel.appendChild(field('Days to give for each next step', days, 'Sets the deadline automatically when a step is marked done. 0 means you set each deadline yourself.'));

      var removeBtn = null, armed = false;
      if (!adding) {
        var members = d.people.filter(function (p) { return p.categoryId === cat.id; }).length;
        removeBtn = h('button', { class: 'btn danger', type: 'button', disabled: members > 0 || d.categories.length < 2, onclick: function () {
          if (!armed) { armed = true; removeBtn.textContent = 'Tap again to delete'; return; }
          runOp('removeCategory', { id: cat.id }, 'Remove category ' + cat.name);
          m.close(); openCategories();
        } }, 'Delete category');
        if (members > 0) panel.appendChild(h('p', { class: 'hint', text: 'To delete this category, first move or remove its ' + members + (members === 1 ? ' person.' : ' people.') }));
      }
      panel.appendChild(m.errEl);
      panel.appendChild(buttons(m, 'Save', removeBtn, function () { m.close(); openCategories(); }));

      panel.addEventListener('submit', function () {
        var clean = steps.map(function (s) { return s.trim(); }).filter(Boolean);
        if (!name.value.trim()) { m.errEl.textContent = 'Give the category a name.'; name.focus(); return; }
        if (!clean.length) { m.errEl.textContent = 'Add at least one step.'; return; }
        if (!cn.value.trim()) { m.errEl.textContent = 'Give the finished cycle a name.'; cn.focus(); return; }
        runOp('saveCategory', { id: adding ? T.makeId('c') : cat.id, name: name.value, cycleName: cn.value, cyclePlural: cp.value, defaultDays: days.value, steps: clean },
          (adding ? 'Add category ' : 'Update category ') + name.value.trim());
        m.close(); openCategories();
      });
    });
  }

  function openSettings() {
    var d = state.data;
    modal('Settings', function (panel, m) {
      var title = h('input', { type: 'text', maxlength: '40', value: d.title });
      var subtitle = h('input', { type: 'text', maxlength: '40', value: d.subtitle });
      var about = h('textarea', { rows: '4', maxlength: '600' });
      about.value = d.about;
      panel.appendChild(field('Title', title));
      panel.appendChild(field('Small line above the title', subtitle));
      panel.appendChild(field('About the project', about, 'Shown at the top for everyone.'));
      panel.appendChild(m.errEl);
      panel.appendChild(buttons(m, 'Save'));
      panel.addEventListener('submit', function () {
        runOp('saveSettings', { title: title.value, subtitle: subtitle.value, about: about.value }, 'Update settings');
        m.close();
      });
    });
  }

  function openSignIn() {
    modal('Admin sign-in', function (panel, m) {
      panel.appendChild(h('p', { text: 'Only the project owner can change anything here. Sign in with a GitHub token. It stays on this device only.' }));
      panel.appendChild(h('ol', null,
        h('li', null, 'Open ', h('a', { href: 'https://github.com/settings/personal-access-tokens/new', target: '_blank', rel: 'noopener', text: 'the GitHub token page' }), '.'),
        h('li', { text: 'Name it “Bridge tracker”. Set the expiry to as long as allowed. Under Repository access, choose Only select repositories, then ' + REPO.name + '.' }),
        h('li', { text: 'Under Repository permissions, set Contents to Read and write. Generate the token and paste it below.' })));
      var tok = h('input', { type: 'password', autocomplete: 'off', spellcheck: 'false' });
      panel.appendChild(field('GitHub token', tok));
      panel.appendChild(m.errEl);
      panel.appendChild(buttons(m, 'Sign in'));

      panel.addEventListener('submit', function () {
        var t = tok.value.trim();
        if (!t) { m.errEl.textContent = 'Paste the token first.'; tok.focus(); return; }
        m.errEl.textContent = 'Checking…';
        state.token = t;
        api('/repos/' + REPO.owner + '/' + REPO.name).then(function (repo) {
          if (!repo.permissions || !repo.permissions.push) { var e1 = new Error('no push'); e1.status = 403; throw e1; }
          return readRemote();
        }).then(function (r) {
          saveToken(t);
          state.admin = true; state.hold = null; state.data = r.data; state.sha = r.sha; state.sig = r.data.rev + '|' + r.data.updatedAt;
          m.close();
          render();
          toast('Signed in. You can edit now.');
        }).catch(function (err) {
          state.token = '';
          m.errEl.textContent = describe(err);
        });
      });
    });
  }

  function signOut() {
    if (DEMO) { location.search = '?demo=1'; return; }
    clearToken();
    state.token = ''; state.admin = false; state.status = ''; state.hold = null; state.moved = false;
    refresh(true);
    render();
  }

  // ---------- demo data (only with ?demo=1) ----------
  function demoData() {
    var t = T.isoDate(new Date());
    var iso = function (m) { return new Date(Date.now() - m * 3600000).toISOString(); };
    var F = 'f', E = 'e';
    return T.normalize({
      rev: 1, title: 'Bridge Crossings', subtitle: 'Reels progress',
      about: 'One reel each: your field, explained to people outside it. A full bar is one finished reel. Check your next step and its deadline, and see how the whole group is moving.',
      categories: [
        { id: F, name: 'Filming', cycleName: 'reel', cyclePlural: 'reels', defaultDays: 7, steps: ['Topics and hooks', 'Script', 'Film'] },
        { id: E, name: 'Editing', cycleName: 'edit', cyclePlural: 'edits', defaultDays: 3, steps: ['Rough cut', 'Captions', 'Review', 'Export'] }
      ],
      updatedAt: new Date().toISOString(),
      people: [
        { id: 'a', name: 'Sara', categoryId: F, color: '#E68364', cycles: 3, done: 1, deadline: T.addDays(t, 2), progressAt: iso(5) },
        { id: 'b', name: 'Omar', categoryId: F, color: '#72BFE7', cycles: 2, done: 2, deadline: T.addDays(t, 1), progressAt: iso(30) },
        { id: 'c', name: 'Salma', categoryId: F, color: '#F1BF5B', cycles: 2, done: 1, deadline: T.addDays(t, -2), progressAt: iso(60) },
        { id: 'd', name: 'Youssef', categoryId: F, color: '#65C49A', cycles: 1, done: 2, deadline: T.addDays(t, 5), progressAt: iso(20) },
        { id: 'e', name: 'Hélène', categoryId: F, color: '#A789DB', cycles: 0, done: 1, deadline: T.addDays(t, 9), progressAt: iso(90) },
        { id: 'f', name: 'Mehdi', categoryId: E, color: '#E8749E', cycles: 4, done: 3, deadline: T.addDays(t, 0), progressAt: iso(44) },
        { id: 'g', name: 'Nour', categoryId: E, color: '#B5D45A', cycles: 2, done: 1, deadline: T.addDays(t, 6), progressAt: iso(12) },
        { id: 'h', name: 'Ilyas', categoryId: E, color: '#4FC8D6', cycles: 0, done: 0, deadline: '', progressAt: '' }
      ]
    });
  }

  // ---------- start ----------
  $('admin-link').addEventListener('click', openSignIn);
  $('q').addEventListener('input', function () { state.query = this.value; renderSections(state.data); });

  if (DEMO) {
    state.data = demoData();
    state.admin = qs.get('admin') === '1';
    state.loaded = true;
    $('demo-note').hidden = false;
    render();
  } else {
    state.token = readToken();
    state.admin = !!state.token;
    refresh(true);
    setInterval(function () { if (!document.hidden && !state.pending) refresh(); }, 60000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && !state.pending) refresh(); });
  }
})();
</script>
</body>
</html>
